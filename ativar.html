<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ativar acesso | Legacy Econtábil</title><style>body{font:16px system-ui;background:#f8f5ef;color:#493725;margin:0}main{max-width:420px;margin:12vh auto;padding:30px;background:white;border-radius:16px}input,button{box-sizing:border-box;width:100%;padding:12px;margin:8px 0}button{background:#594431;color:white;border:0;border-radius:8px}</style><main><h1>Legacy Econtábil</h1><p>Defina sua senha de acesso.</p><form id="form"><input id="senha" type="password" autocomplete="new-password" minlength="12" required placeholder="Senha (mínimo 12 caracteres)"><input id="confirmar" type="password" autocomplete="new-password" required placeholder="Confirme a senha"><button id="salvar" disabled>Ativar acesso</button></form><p id="msg">Validando convite...</p><a href="/">Voltar ao login</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="/api/config.js"></script><script>const db=supabase.createClient(EMPRESAS_CONFIG.supabaseUrl,EMPRESAS_CONFIG.supabaseAnonKey,{auth:{persistSession:false,detectSessionInUrl:true}});const msg=document.querySelector('#msg'),btn=document.querySelector('#salvar');(async()=>{const {data,error}=await db.auth.getSession();if(error||!data.session){msg.textContent='Convite inválido ou expirado. Solicite ajuda ao administrador.';return}btn.disabled=false;msg.textContent='Convite validado.'})();document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const p=document.querySelector('#senha').value;if(p!==document.querySelector('#confirmar').value){msg.textContent='As senhas não coincidem.';return}btn.disabled=true;const {error}=await db.auth.updateUser({password:p});if(error){msg.textContent=error.message;btn.disabled=false;return}await db.auth.signOut({scope:'local'});location.replace('/')};</script></html>
